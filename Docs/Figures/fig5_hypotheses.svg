<svg xmlns="http://www.w3.org/2000/svg" width="900" height="569" viewBox="0 0 900 569" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<title>측정으로 죽인 가설</title>
<rect width="900" height="569" fill="#ffffff"/>
<text x="50" y="38" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="600">측정이 죽인 가설 11개</text>
<text x="50" y="62" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="400">코드를 읽고 «비싸 보인다»로 세운 가설은 대부분 틀렸다. 남은 둘은 추측으로는 찾을 수 없었다.</text>
<text x="50" y="104" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="600">기각</text>
<text x="330" y="104" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="600">무엇이 죽였나</text>
<line x1="50" y1="114" x2="850" y2="114" stroke="#1a1a1a" stroke-width="1"/>
<line x1="50" y1="141" x2="62" y2="129" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="129" x2="62" y2="141" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="139" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">적↔적 트리거 충돌</text>
<text x="330" y="139" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">매트릭스에서 이미 꺼져 있었다</text>
<line x1="50" y1="168" x2="62" y2="156" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="156" x2="62" y2="168" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="166" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">GC 정지</text>
<text x="330" y="166" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">GC.Collect = 0.000</text>
<line x1="50" y1="195" x2="62" y2="183" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="183" x2="62" y2="195" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="193" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">"적이 많으면 느리다"</text>
<text x="330" y="193" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">적만 800마리 = 121 fps</text>
<line x1="50" y1="222" x2="62" y2="210" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="210" x2="62" y2="222" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="220" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">풀 Instantiate 폭풍</text>
<text x="330" y="220" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">4회 중 1회만 기준 충족</text>
<line x1="50" y1="249" x2="62" y2="237" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="237" x2="62" y2="249" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="247" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">적 사망 처리 폭주</text>
<text x="330" y="247" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">4회 중 1회만</text>
<line x1="50" y1="276" x2="62" y2="264" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="264" x2="62" y2="276" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="274" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">데미지 팝업 생성</text>
<text x="330" y="274" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">4회 중 1회만</text>
<line x1="50" y1="303" x2="62" y2="291" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="291" x2="62" y2="303" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="301" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">OverlapCircleAll 할당</text>
<text x="330" y="301" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">프레임의 1.3 %</text>
<line x1="50" y1="330" x2="62" y2="318" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="318" x2="62" y2="330" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="328" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">투사체 Update()</text>
<text x="330" y="328" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">투사체가 1~3개뿐</text>
<line x1="50" y1="357" x2="62" y2="345" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="345" x2="62" y2="357" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="355" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">ExpDrop.Update 가 비싸다</text>
<text x="330" y="355" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">개당 0.9 µs · 개선 −11 %</text>
<line x1="50" y1="384" x2="62" y2="372" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="372" x2="62" y2="384" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="382" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">DamagePopup(TMP)가 비싸다</text>
<text x="330" y="382" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">개당 1.6 µs · 프레임당 0.2 ms</text>
<line x1="50" y1="411" x2="62" y2="399" stroke="#d94f2b" stroke-width="2"/>
<line x1="50" y1="399" x2="62" y2="411" stroke="#d94f2b" stroke-width="2"/>
<text x="74" y="409" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="400">Update() 호출 고정 비용</text>
<text x="330" y="409" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">0.139 µs — 예측과 10배 이상 차이</text>
<line x1="50" y1="449" x2="850" y2="449" stroke="#e2e2e2"/>
<text x="50" y="475" font-size="13" fill="#2f7d5d" text-anchor="start" font-weight="700">찾은 것</text>
<circle cx="56" cy="499" r="5" fill="#2f7d5d"/>
<text x="74" y="504" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600">B8 — 이웃 12칸 무언 절단</text>
<text x="74" y="524" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">적 400에서 21 % · 800에서 71 % 가 이웃을 잘라 먹고 판정</text>
<circle cx="56" cy="545" r="5" fill="#2f7d5d"/>
<text x="74" y="550" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600">적 겹침의 원인은 밀도</text>
<text x="74" y="570" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">적 800에서 85 %가 0.5유닛 안에 이웃을 둔다 (분리 반경은 0.85)</text>
</svg>
