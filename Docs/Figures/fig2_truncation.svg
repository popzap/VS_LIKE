<text x="72" y="224.0" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="400">40 %</text>
<line x1="80" y1="153.0" x2="540" y2="153.0" stroke="#e2e2e2"/>
<text x="72" y="157.0" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="400">60 %</text>
