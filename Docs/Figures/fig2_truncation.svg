<text x="124.46666666666667" y="343.6215" font-size="12" fill="#d94f2b" text-anchor="middle" font-weight="600">0.7 %</text>
<rect x="156.7" y="352.5" width="39.9" height="1.5" fill="#2f7d5d"/>
<text x="176.60000000000002" y="344.5" font-size="12" fill="#2f7d5d" text-anchor="middle" font-weight="600">0 %</text>
<text x="156.66666666666669" y="374" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">적 130</text>
<text x="156.66666666666669" y="392" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="400">실제 게임 상한</text>
<rect x="257.9" y="281.5" width="39.9" height="72.5" fill="#d94f2b"/>
<text x="277.8" y="273.47249999999997" font-size="12" fill="#d94f2b" text-anchor="middle" font-weight="600">21.6 %</text>
<rect x="310.0" y="352.5" width="39.9" height="1.5" fill="#2f7d5d"/>
<text x="329.93333333333334" y="344.5" font-size="12" fill="#2f7d5d" text-anchor="middle" font-weight="600">0 %</text>
<text x="310.0" y="374" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">적 400</text>
<rect x="411.2" y="115.3" width="39.9" height="238.7" fill="#d94f2b"/>
<text x="431.1333333333334" y="107.3125" font-size="12" fill="#d94f2b" text-anchor="middle" font-weight="600">71.2 %</text>
<rect x="463.3" y="347.7" width="39.9" height="6.3" fill="#2f7d5d"/>
<text x="483.2666666666667" y="339.7355" font-size="12" fill="#2f7d5d" text-anchor="middle" font-weight="600">1.9 %</text>
<text x="463.33333333333337" y="374" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600">적 800</text>
<text x="463.33333333333337" y="392" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="400">게임에 없는 조건</text>
<line x1="80" y1="354" x2="540" y2="354" stroke="#1a1a1a"/>
<rect x="566" y="62" width="11" height="11" fill="#d94f2b"/>
<text x="583" y="72" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400">버퍼 12</text>
<rect x="566" y="82" width="11" height="11" fill="#2f7d5d"/>
<text x="583" y="92" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400">버퍼 64</text>
<text x="566" y="130" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">분리 비용 (프레임 대비)</text>
<text x="566" y="152" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">적 130</text>
<text x="618" y="152" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400">1.3 %</text>
<text x="658" y="152" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">→</text>
<text x="678" y="152" font-size="11" fill="#2f7d5d" text-anchor="start" font-weight="600">1.1 %</text>
<text x="566" y="172" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">적 400</text>
<text x="618" y="172" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400">7.3 %</text>
<text x="658" y="172" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">→</text>
<text x="678" y="172" font-size="11" fill="#2f7d5d" text-anchor="start" font-weight="600">7.0 %</text>
<text x="566" y="192" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">적 800</text>
<text x="618" y="192" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400">28 %</text>
<text x="658" y="192" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">→</text>
<text x="678" y="192" font-size="11" fill="#d94f2b" text-anchor="start" font-weight="600">41 %</text>
<text x="566" y="234" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">실제 구간에서는 비용 차이가</text>
<text x="566" y="250" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">측정 노이즈 안이다.</text>
<text x="566" y="274" font-size="11" fill="#d94f2b" text-anchor="start" font-weight="400">🔴 800에서는 비싸진다 —</text>
<text x="566" y="290" font-size="11" fill="#d94f2b" text-anchor="start" font-weight="400">사전 등록 기준은 «실패»로</text>
<text x="566" y="306" font-size="11" fill="#d94f2b" text-anchor="start" font-weight="400">남겼다.</text>
</svg>
