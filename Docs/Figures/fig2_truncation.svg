<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<title>이웃 절단 비율 — 버퍼 12 vs 64</title>
<rect width="760" height="420" fill="#ffffff"/>
<text x="80" y="34" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="600">이웃 절단 비율 — 버퍼 12 → 64</text>
<text x="80" y="58" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="400">적 130은 Waves.csv 의 실제 MaxAlive 상한. 800은 게임에 존재하지 않는 조건이다.</text>
