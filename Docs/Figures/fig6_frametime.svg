<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<title>프레임 타임 — 적 수별 · 무기 유무</title>
<rect width="900" height="470" fill="#ffffff"/>
<text x="50" y="34" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="600">프레임 타임은 언제 무너지는가</text>
<text x="50" y="58" font-size="13" fill="#d94f2b" text-anchor="start" font-weight="400">🔴 영상으로는 잘 안 보인다 — 중앙값은 멀쩡하고 «꼬리»만 터지기 때문이다. 그래서 분포로 보여 준다.</text>
<text x="62" y="92" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600">적만 (무기 없음) · 버퍼 64</text>
<text x="62" y="110" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400">같은 조건의 실행만 모았다</text>
