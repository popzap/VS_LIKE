<text x="62" y="434" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400">실제 게임 상한(130)에서 p99 가 9 ms 다 — 60 fps 예산의 절반이다.</text>
<text x="62" y="452" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="400">800은 Waves.csv 어디에도 없다. 거기서만 무너진다.</text>
<text x="520" y="92" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600">적 800 · 무기 유무 (연속 실행 짝 비교)</text>
